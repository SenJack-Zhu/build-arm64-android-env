name: Build Fcitx5 Ecosystem for Termux arm64

on:
  workflow_dispatch: # 支持手动一键触发编译

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest # 借用官方开箱即用的编译环境

    steps:
      - name: Free up disk space
        run: |
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Clone Termux Packages Repository
        run: |
          git clone --depth 1 https://github.com/termux/termux-packages.git /home/builder/termux-packages

      - name: Align and Pin Component Versions
        run: |
          cd /home/builder/termux-packages/packages/fcitx5
          
          # 1. 强制将 fcitx5-rime 的版本和源码地址指向上游（或者你想要的特定版本）
          # 这里我们可以直接修改对应 package 的 build.sh
          sed -i 's/TERMUX_PKG_VERSION=.*/TERMUX_PKG_VERSION=5.1.19/' ../fcitx5/build.sh
          sed -i 's/TERMUX_PKG_VERSION=.*/TERMUX_PKG_VERSION=5.1.19/' ../fcitx5-rime/build.sh
          sed -i 's/TERMUX_PKG_VERSION=.*/TERMUX_PKG_VERSION=5.1.19/' ../fcitx5-chinese-addons/build.sh
          
          # 提示：由于版本变了，对应的 SHA256 校验码需要跳过或者更新。
          # 我们可以直接在 build.sh 结尾加上强制不校验，或者用官方脚本生成
          echo "TERMUX_PKG_SKIP_SRC_SHA256=true" >> ../fcitx5-rime/build.sh
          echo "TERMUX_PKG_SKIP_SRC_SHA256=true" >> ../fcitx5-chinese-addons/build.sh

      - name: Build Fcitx5 Core
        run: |
          cd /home/builder/termux-packages
          # 使用官方内置脚本编译，它会自动处理 NDK 工具链和所有 alpha/arm64 依赖
          ./build-package.sh -a aarch64 fcitx5

      - name: Build Fcitx5 Chinese Addons
        run: |
          cd /home/builder/termux-packages
          ./build-package.sh -a aarch64 fcitx5-chinese-addons

      - name: Build Fcitx5 Rime
        run: |
          cd /home/builder/termux-packages
          ./build-package.sh -a aarch64 fcitx5-rime

      - name: Collect Debian Packages
        run: |
          mkdir -p /home/builder/output
          find /home/builder/termux-packages/output -name "*.deb" -exec cp {} /home/builder/output/ \;
          ls -la /home/builder/output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fcitx5-arm64-debs
          path: /home/builder/output/*.deb
