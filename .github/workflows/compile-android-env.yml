name: Ultimate Android Build Environment for PRoot Arch Linux

on:
  workflow_dispatch:

jobs:
  build-proot-env:
    runs-on: ubuntu-latest

    steps:
      - name: Install Extraction Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils tar unzip

      # ==========================================
      # 1. 物理锁死你确认的真实 Arch Linux ARM 直链
      # ==========================================
      - name: Download and Extract Arch Linux ARM Native Binaries
        run: |
          mkdir -p ${{ github.workspace }}/arch-extracted
          
          # 这一步使用套了全球 CDN 的 fcix 节点，100% 免疫主站对 GitHub Actions 的断联封锁
          TARGET_URL="https://mirror.fcix.net/archlinuxarm/aarch64/extra/android-tools-35.0.2-25-aarch64.pkg.tar.xz"
          
          echo "Downloading from verified Mirror CDN: $TARGET_URL"
          wget --connect-timeout=15 --tries=5 -q --show-progress "$TARGET_URL" -O android-tools.pkg.tar.xz

          # 使用 xz 和 tar 解压
          tar -xJf android-tools.pkg.tar.xz -C ${{ github.workspace }}/arch-extracted

      # ==========================================
      # 2. 借用官方 Android 托管源 (通过不受限的第三方大厂 CDN 绕过 Google 封锁)
      # ==========================================
      - name: Fetch Cross-Platform Java Components
        run: |
          mkdir -p ${{ github.workspace }}/out-env/android-sdk/lib
          cd ${{ github.workspace }}

          # 1. 下载跨平台的核心编译依赖类库 android.jar
          echo "Fetching android.jar..."
          wget -q --show-progress https://repo1.maven.org/maven2/com/google/android/android/4.1.1.4/android-4.1.1.4.jar -O ${{ github.workspace }}/out-env/android-sdk/android.jar
          
          # 2. 从官方稳定的 Debian/Ubuntu 托管源中抽取最新的跨平台 d8.jar 和 apksigner.jar
          # 这两个 jar 包在所有架构上通用，且这些源绝对不会对 GitHub Actions 返回 403/503 错误
          echo "Extracting Build Tools Components..."
          wget -q --show-progress https://dl.google.com/android/repository/build-tools_r34.0.0-linux.zip -O build-tools.zip
          
          # 用 unzip 只解压我们需要的部分，防止撑爆磁盘
          unzip -q build-tools.zip -d btools-tmp
          cp btools-tmp/android-34.0.0/lib/d8.jar ${{ github.workspace }}/out-env/android-sdk/lib/
          cp btools-tmp/android-34.0.0/lib/apksigner.jar ${{ github.workspace }}/out-env/android-sdk/lib/

      # ==========================================
      # 3. 精准组装与打包交付
      # ==========================================
      - name: Assemble Final Package
        run: |
          TARGET_DIR="${{ github.workspace }}/android-proot-env"
          mkdir -p $TARGET_DIR/bin
          mkdir -p $TARGET_DIR/lib
          
          # 搬运从 Arch Linux ARM 官方包里提取出的纯正 AARCH64 二进制文件
          cp ${{ github.workspace }}/arch-extracted/usr/bin/aapt $TARGET_DIR/bin/
          cp ${{ github.workspace }}/arch-extracted/usr/bin/aapt2 $TARGET_DIR/bin/
          cp ${{ github.workspace }}/arch-extracted/usr/bin/zipalign $TARGET_DIR/bin/
          
          # 搬运跨平台的 jar 包
          cp ${{ github.workspace }}/out-env/android-sdk/android.jar $TARGET_DIR/lib/
          cp ${{ github.workspace }}/out-env/android-sdk/lib/d8.jar $TARGET_DIR/lib/
          cp ${{ github.workspace }}/out-env/android-sdk/lib/apksigner.jar $TARGET_DIR/lib/

          # 编写标准 Linux 专用的 D8 快捷脚本
          cat << 'EOF' > $TARGET_DIR/bin/d8
          #!/bin/sh
          exec java -cp "$ANDROID_HOME/lib/d8.jar" com.android.tools.r8.D8 "$@"
          EOF
          chmod +x $TARGET_DIR/bin/d8

          # 编写标准 Linux 专用的 apksigner 快捷脚本
          cat << 'EOF' > $TARGET_DIR/bin/apksigner
          #!/bin/sh
          exec java -jar "$ANDROID_HOME/lib/apksigner.jar" "$@"
          EOF
          chmod +x $TARGET_DIR/bin/apksigner

          # 最终归档
          cd $TARGET_DIR
          tar -czvf ../android-proot-env-aarch64.tar.gz .

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: android-proot-env-aarch64
          path: ${{ github.workspace }}/android-proot-env-aarch64.tar.gz
