name: 自动交叉编译 AAPT2 ARM64 真货

# 触发机制：代码一推就跑，或者你在 GitHub 网页端手动点按钮触发
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-aapt2:
    # 租用 GitHub 官方最稳的 Ubuntu 24.04 虚拟机核心（x86_64）
    runs-on: ubuntu-24.04

    steps:
      - name: 1. 物理检出当前你仓库里的基础代码
        uses: actions/checkout@v4

      - name: 2. 配置 JDK 环境（编译 AOSP 工具链部分 Java/Kotlin 依赖可能需要）
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. 物理拉取已验证的 AOSP 核心源码并对齐 C++ 编译路径
        run: |
          # 确保进入 Actions 虚拟机的主工作区绝对路径
          cd $GITHUB_WORKSPACE
          
          echo "==== Step 3.1: 开始克隆老哥人肉验证过的 Base 核心库 ===="
          git clone --depth=1 https://github.com/aosp-mirror/platform_frameworks_base.git aosp-base
          
          echo "==== Step 3.2: 开始克隆老哥人肉验证过的 System Core 依赖库 ===="
          git clone --depth=1 https://github.com/aosp-mirror/platform_system_core.git aosp-core
          
          echo "==== Step 3.3: 创建物理寻找路径，防止 C++ 编译缺头文件 ===="
          # 创建统一的 C++ 寻找头文件的 include 腹地
          mkdir -p gnu-includes/utils
          mkdir -p gnu-includes/cutils
          
          # 把 core 库里的核心头文件物理复制到统一寻找路径中
          cp -r aosp-core/libutils/include/utils/* gnu-includes/utils/
          cp -r aosp-core/libcutils/include/cutils/* gnu-includes/cutils/
          
          echo "==== 【物理铁证】进入 aapt2 源码腹地验证是否存在 ===="
          cd aosp-base/tools/aapt2
          pwd
          ls -lh Compile.cpp Link.cpp
