- name: 克隆官方 AOSP 核心工具链源码 (绝对不 404)
        run: |
          # 切换到 Actions 虚拟机的安全工作目录
          cd $GITHUB_WORKSPACE
          
          # 直接拉取 Google 官方 AOSP 专门托管独立 aapt2 构建逻辑的完整标准仓库
          # 这个地址由 Google 官方长期维护，走标准的 HTTPS 协议，Actions 虚拟机直连秒过
          git clone --depth=1 https://android.googlesource.com/platform/frameworks/base aosp-frameworks-base
          
          # 进入 aapt2 的核心 C++ 源码腹地
          cd aosp-frameworks-base/tools/aapt2
          echo "AAPT2 核心源码已精准锁定位置：" && pwd
