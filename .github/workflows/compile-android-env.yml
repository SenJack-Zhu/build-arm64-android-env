name: 跨库围剿提取 ARM64 原生 AAPT2

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  extract-aapt2:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 物理检出你自己的仓库
        uses: actions/checkout@v4

      - name: 2. 克隆他活着的 Apktool 仓库 (走标准明文 HTTPS 绝不卡死)
        run: |
          cd $GITHUB_WORKSPACE
          echo "==== 开始明文突袭 Apktool-android 仓库 ===="
          git clone --depth=1 https://github.com/MuntashirAkon/Apktool-android.git apktool-env
          
          cd apktool-env
          echo "==== 仓库合围成功，开始全盘通缉 aapt2 原生二进制 ===="
          # 全盘无死角搜索所有名为 aapt2 的物理文件
          find . -name "*aapt2*"

      - name: 3. 精准剥离并洗劫 ARM64 静态目标
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p out_bin
          
          echo "==== 开始跨目录物理抽取 ===="
          # 根据该项目标准结构，其原生二进制存放在 app/src/main/assets/ 或相似的特定底层资源目录中
          # 我们直接用 find 强行把所有匹配的文件全部物理复制到输出沙盒中
          find apktool-env/ -type f -name "aapt2*" -exec cp {} out_bin/ \;
          
          echo "==== 检查截获的战果 ===="
          ls -la out_bin/

      - name: 4. 实体出货：将直接挖出来的 ARM64 纯血 binary 上载到网页端
        uses: actions/upload-artifact@v4
        with:
          name: aapt2-arm64-looted-binary
          path: ${{ github.workspace }}/out_bin/
          retention-days: 5
