name: Compile Complete Android Build Environment for AARCH64

on:
  workflow_dispatch:

jobs:
  build-env:
    runs-on: ubuntu-latest

    steps:
      - name: Install PC Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential cmake ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu wget unzip

      - name: Checkout AOSP Tools Source
        uses: actions/checkout@v4
        with:
          repository: 'JonForShort/android-tools'
          submodules: 'recursive'
          path: 'android-tools-source'

      - name: Cross-Compile All Tools to Linux-AARCH64
        # 强制在这个绝对路径下当阵地
        working-directory: ${{ github.workspace }}/android-tools-source
        run: |
          # 彻底废除 cd 命令！直接用 cmake 的 -B (Build输出路径) 和 -S (Source源码路径) 物理锁死！
          # -S . 代表源码就在当前 working-directory
          # -B build_out 代表编译生成的中间件全部丢进当前目录下的 build_out
          cmake -S . -B build_out \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja
          
          # 物理指定在编译输出目录下开轰
          ninja -C build_out aapt aapt2 aidl zipalign

      - name: Package the Complete Environment Binaries
        working-directory: ${{ github.workspace }}/android-tools-source
        run: |
          mkdir -p android-env-aarch64
          # 路径完全透明，直接去 build_out 捞货
          cp build_out/aapt build_out/aapt2 build_out/aidl build_out/zipalign ./android-env-aarch64/
          tar -czvf ../android-env-aarch64.tar.gz android-env-aarch64

      - name: Upload Complete Android Environment
        uses: actions/upload-artifact@v4
        with:
          name: android-core-tools-aarch64
          path: ${{ github.workspace }}/android-env-aarch64.tar.gz
