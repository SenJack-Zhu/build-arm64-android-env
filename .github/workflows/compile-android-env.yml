name: 交叉编译 ARM64 原生 AAPT2 (纯净克隆版)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-aapt2-static-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 物理检出你自己的仓库 (绝对绿灯)
        uses: actions/checkout@v4

      - name: 2. 纯明文命令行物理围剿 aapt2 编译骨架
        run: |
          cd $GITHUB_WORKSPACE
          echo "==== 开始绕过 API 限制，明文克隆编译主库 ===="
          
          # 仅克隆主库本体，绝不带 --recursive，彻底避开鉴权死锁与 API 404
          git clone --depth=1 https://github.com/by-syk/aapt2-sdk.git aapt2-build-env
          
          cd aapt2-build-env
          echo "==== 主库拉取成功，开始透视并手动补齐子模块 ===="
          ls -la
          
          # 查看它到底用了哪些子模块，防止脑补地址
          git config --file .gitmodules --get-regexp path || echo "未发现子模块配置"

      - name: 3. 调动 NDK r28c 尝试初步配置测试
        run: |
          if [ -d "$GITHUB_WORKSPACE/aapt2-build-env" ]; then
            cd $GITHUB_WORKSPACE/aapt2-build-env
            mkdir build && cd build
            # 尝试跑一下 cmake，看它当前缺哪个子模块的 C++ 头文件，它缺啥我们等下补啥！
            cmake .. \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-35 \
              -DCMAKE_BUILD_TYPE=Release || echo "CMake 预扫描完毕，等待捕捉缺失依赖..."
          fi
