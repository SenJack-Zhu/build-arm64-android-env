name: Ironclad Android Environment Build

on:
  workflow_dispatch:

jobs:
  build-proot-env:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. 检出当前仓库（把你的 android-tools 拉进来）
      # ==========================================
      - name: Checkout Local Package
        uses: actions/checkout@v4

      - name: Install Base Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils tar unzip

      # ==========================================
      # 2. 完美的 Linux 原生解压（绝不报错）
      # ==========================================
      - name: Extract Arch Linux ARM Binaries
        run: |
          mkdir -p ${{ github.workspace }}/arch-extracted
          LOCAL_PKG="${{ github.workspace }}/libs/android-tools-35.0.2-25-aarch64.pkg.tar.xz"
          
          if [ ! -f "$LOCAL_PKG" ]; then
            echo "错误：本地 libs 目录中没有检测到包！请确认已 push 到仓库！"
            exit 1
          fi
          
          # Linux 原生 tar 完美兼容 Arch 签名包，绝不报错
          tar -xJf "$LOCAL_PKG" -C ${{ github.workspace }}/arch-extracted

      # ==========================================
      # 3. 用 Python 强行过墙：抓取跨平台 Java 组件
      # ==========================================
      - name: Force Fetch Java Components via Python
        run: |
          mkdir -p ${{ github.workspace }}/out-env/android-sdk/lib
          
          # 伪装并下载跨平台的 d8.jar 和 apksigner.jar (直接用 Python 内存流下载，破除 403)
          python3 -c "
          import urllib.request
          req = urllib.request.Request('https://dl.google.com/android/repository/build-tools_r34.0.0-linux.zip', headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as response, open('build-tools.zip', 'wb') as out_file:
              out_file.write(response.read())
          "
          unzip -q build-tools.zip -d btools-tmp
          cp btools-tmp/android-34.0.0/lib/d8.jar ${{ github.workspace }}/out-env/android-sdk/lib/
          cp btools-tmp/android-34.0.0/lib/apksigner.jar ${{ github.workspace }}/out-env/android-sdk/lib/

          # 伪装并下载跨平台的 android.jar
          python3 -c "
          import urllib.request
          req = urllib.request.Request('https://dl.google.com/android/repository/platform-34_r03.zip', headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as response, open('platform.zip', 'wb') as out_file:
              out_file.write(response.read())
          "
          unzip -q platform.zip -d plat-tmp
          cp plat-tmp/android-34/android.jar ${{ github.workspace }}/out-env/android-sdk/

      # ==========================================
      # 4. 精准组装与打包交付
      # ==========================================
      - name: Assemble Final Package
        run: |
          TARGET_DIR="${{ github.workspace }}/android-proot-env"
          mkdir -p $TARGET_DIR/bin
          mkdir -p $TARGET_DIR/lib
          
          # 搬运原生 AARCH64 二进制文件
          cp ${{ github.workspace }}/arch-extracted/usr/bin/aapt $TARGET_DIR/bin/
          cp ${{ github.workspace }}/arch-extracted/usr/bin/aapt2 $TARGET_DIR/bin/
          cp ${{ github.workspace }}/arch-extracted/usr/bin/zipalign $TARGET_DIR/bin/
          
          # 搬运跨平台的 jar 包
          cp ${{ github.workspace }}/out-env/android-sdk/android.jar $TARGET_DIR/lib/
          cp ${{ github.workspace }}/out-env/android-sdk/lib/d8.jar $TARGET_DIR/lib/
          cp ${{ github.workspace }}/out-env/android-sdk/lib/apksigner.jar $TARGET_DIR/lib/

          # 编写快捷脚本
          cat << 'EOF' > $TARGET_DIR/bin/d8
          #!/bin/sh
          exec java -cp "$ANDROID_HOME/lib/d8.jar" com.android.tools.r8.D8 "$@"
          EOF
          chmod +x $TARGET_DIR/bin/d8

          cat << 'EOF' > $TARGET_DIR/bin/apksigner
          #!/bin/sh
          exec java -jar "$ANDROID_HOME/lib/apksigner.jar" "$@"
          EOF
          chmod +x $TARGET_DIR/bin/apksigner

          # 归档输出
          cd $TARGET_DIR
          tar -czvf ../android-proot-env-aarch64.tar.gz .

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: android-proot-env-aarch64
          path: ${{ github.workspace }}/android-proot-env-aarch64.tar.gz
