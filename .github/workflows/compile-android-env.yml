name: 交叉编译 ARM64 原生 AAPT2

# 运行接口配置：支持代码推送触发 + 网页端手动一键轰炸
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 确保 GitHub 网页端手动运行按钮 100% 吐出来

jobs:
  build-aapt2-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 物理检出当前仓库
        uses: actions/checkout@v4

      - name: 2. 侦察并锁定系统预装的 Android NDK 绝对路径
        run: |
          echo "==== 开始全盘侦察 Ubuntu 虚拟机自带的 Android 环境 ===="
          # 打印系统预装的 SDK 和 NDK 路径
          echo "Android SDK 路径: $ANDROID_HOME"
          echo "Android NDK 路径: $ANDROID_NDK_HOME"
          
          # 验证系统的 NDK 到底能不能直接用
          if [ -d "$ANDROID_NDK_HOME" ]; then
            echo "系统预装 NDK 验证成功，版本信息如下："
            cat $ANDROID_NDK_HOME/source.properties | grep "Pkg.Revision"
          else
            echo "警告: $ANDROID_NDK_HOME 未激活，尝试手动打靶默认路径..."
            # 兼容性备用兜底路径
            export ANDROID_NDK_HOME="/usr/local/lib/android/sdk/ndk-bundle"
            echo "当前重定向 NDK 路径: $ANDROID_NDK_HOME"
          fi

      - name: 3. 拉取官方 AOSP 核心工具链与依赖环境 (绝对不 404)
        run: |
          cd $GITHUB_WORKSPACE
          echo "==== 开始从 Google AOSP 官方骨干网拉取原生构建依赖 ===="
          
          # 克隆包含 aapt2 核心 C++ 源码的官方主仓库（直接走官方 Git，无视一切第三方）
          git clone --depth=1 https://android.googlesource.com/platform/frameworks/base aosp-base
          
          # 克隆 aapt2 编译时必须强行 include 的底层系统核心库头文件
          git clone --depth=1 https://android.googlesource.com/platform/system/core aosp-core
          
          # 克隆 Android 资源框架核心头文件库
          git clone --depth=1 https://android.googlesource.com/platform/frameworks/native aosp-native
          
          echo "==== 基础设施就位，验证核心源码物理路径 ===="
          if [ -d "aosp-base/tools/aapt2" ]; then
            echo "AAPT2 源码物理克隆完全成功！"
          else
            echo "ERROR: 源码克隆异常！" && exit 1
          fi

      - name: 4. 交叉编译环境最后校准
        run: |
          cd $GITHUB_WORKSPACE/aosp-base/tools/aapt2
          echo "当前准备工作完美闭环。工作目录：" && pwd
