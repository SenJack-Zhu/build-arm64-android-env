name: Ultimate Offline and Maven Android Build

on:
  workflow_dispatch:

jobs:
  build-proot-env:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. 检出当前仓库（自动拉取你上传的 2.4M 压缩包）
      # ==========================================
      - name: Checkout Repository Components
        uses: actions/checkout@v4

      - name: Install Extraction Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils tar wget

      # ==========================================
      # 2. 离线解压你上传的 Arch Linux ARM 二进制
      # ==========================================
      - name: Extract Local Arch Linux ARM Binaries
        run: |
          mkdir -p ${{ github.workspace }}/arch-extracted
          
          LOCAL_PKG="${{ github.workspace }}/libs/android-tools-35.0.2-25-aarch64.pkg.tar.xz"
          
          if [ ! -f "$LOCAL_PKG" ]; then
            echo "错误：未能检查到本地包！请确保你创建了 libs/ 目录并把包 push 上去了！"
            exit 1
          fi
          
          echo "Processing local package: $LOCAL_PKG"
          tar -xJf "$LOCAL_PKG" -C ${{ github.workspace }}/arch-extracted

      # ==========================================
      # 3. 从 Maven 中央仓库和公共托管拉取跨平台 Java 组件 (绝不走 Google 域名)
      # ==========================================
      - name: Fetch Cross-Platform Java Components (Anti-403)
        run: |
          mkdir -p ${{ github.workspace }}/out-env/android-sdk/lib
          
          # 1. 抓取编译依赖库 android.jar (来自 Maven 官方镜像)
          echo "Fetching android.jar from Maven Central..."
          wget -q --show-progress https://repo1.maven.org/maven2/com/google/android/android/4.1.1.4/android-4.1.1.4.jar -O ${{ github.workspace }}/out-env/android-sdk/android.jar
          
          # 2. 抓取官方编译核心（改走存储在开源大厂公共源上的跨平台套件，规避 Google 拦截）
          echo "Fetching Build Tools via Android-Rebuild Repository..."
          wget -q --show-progress https://raw.githubusercontent.com/DeckerSU/Su_Android_Template/master/tools/apksigner.jar -O ${{ github.workspace }}/out-env/android-sdk/lib/apksigner.jar
          wget -q --show-progress https://raw.githubusercontent.com/DeckerSU/Su_Android_Template/master/tools/d8.jar -O ${{ github.workspace }}/out-env/android-sdk/lib/d8.jar

      # ==========================================
      # 4. 精准组装与打包交付
      # ==========================================
      - name: Assemble Final Package
        run: |
          TARGET_DIR="${{ github.workspace }}/android-proot-env"
          mkdir -p $TARGET_DIR/bin
          mkdir -p $TARGET_DIR/lib
          
          # 搬运从本地 Arch 包里提取出的纯正 AARCH64 二进制文件
          cp ${{ github.workspace }}/arch-extracted/usr/bin/aapt $TARGET_DIR/bin/
          cp ${{ github.workspace }}/arch-extracted/usr/bin/aapt2 $TARGET_DIR/bin/
          cp ${{ github.workspace }}/arch-extracted/usr/bin/zipalign $TARGET_DIR/bin/
          
          # 搬运跨平台的 jar 包
          cp ${{ github.workspace }}/out-env/android-sdk/android.jar $TARGET_DIR/lib/
          cp ${{ github.workspace }}/out-env/android-sdk/lib/d8.jar $TARGET_DIR/lib/
          cp ${{ github.workspace }}/out-env/android-sdk/lib/apksigner.jar $TARGET_DIR/lib/

          # 编写 D8 快捷脚本
          cat << 'EOF' > $TARGET_DIR/bin/d8
          #!/bin/sh
          exec java -cp "$ANDROID_HOME/lib/d8.jar" com.android.tools.r8.D8 "$@"
          EOF
          chmod +x $TARGET_DIR/bin/d8

          # 编写 apksigner 快捷脚本
          cat << 'EOF' > $TARGET_DIR/bin/apksigner
          #!/bin/sh
          exec java -jar "$ANDROID_HOME/lib/apksigner.jar" "$@"
          EOF
          chmod +x $TARGET_DIR/bin/apksigner

          # 最终归档
          cd $TARGET_DIR
          tar -czvf ../android-proot-env-aarch64.tar.gz .

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: android-proot-env-aarch64
          path: ${{ github.workspace }}/android-proot-env-aarch64.tar.gz
