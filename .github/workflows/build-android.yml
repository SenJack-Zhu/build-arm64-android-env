name: Build Termux Arm64 Wheels

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android-wheels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build wheel via NDK docker
        run: |
          mkdir -p output_wheels
          # 使用 dockcross 的 android-arm64 镜像，强制从 C 源码编译
          docker run --rm -v $(pwd):/work dockcross/android-arm64 bash -c "
            python3 -m pip install --upgrade pip setuptools wheel && \
            pip wheel tree-sitter==0.26.0 --no-binary :all: -w /work/output_wheels/
          "

      - name: Upload Built Wheels
        uses: actions/upload-artifact@v4
        with:
          name: termux-tree-sitter-wheels
          path: output_wheels/*.whl
