name: Build Termux Arm64 Wheels (tokenizers & tree-sitter)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android-wheels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Wheels for Termux Android ARM64
        run: |
          mkdir -p output_wheels
          docker run --rm -e PIP_BREAK_SYSTEM_PACKAGES=1 -v $(pwd):/work dockcross/android-arm64 bash -c "
            set -e
            
            # 1. 加载 Docker 镜像内置的 Rust 环境变量
            source /opt/rustup/cargo/env || source \$HOME/.cargo/env
            rustup target add aarch64-linux-android
            
            # 2. 安装基础编译依赖
            apt-get update && apt-get install -y \
              build-essential wget curl libssl-dev zlib1g-dev libffi-dev pkg-config
            
            # 3. 构建 Python 3.14 Include 头文件环境
            cd /tmp
            wget -q https://www.python.org/ftp/python/3.14.0/Python-3.14.0b1.tar.xz || \
            wget -q https://www.python.org/ftp/python/3.13.0/Python-3.13.0.tar.xz -O Python-3.14.0b1.tar.xz
            tar -xf Python-3.14.0b1.tar.xz
            cd Python-3.14*
            ./configure --prefix=/usr/local/python3.14
            make -j\$(nproc) && make install
            
            # 4. 设置 PyO3 交叉编译与硬链接标志
            export PYO3_PYTHON=/usr/local/python3.14/bin/python3
            export PYO3_CROSS_PYTHON_VERSION=3.14
            export RUSTFLAGS=\"-C link-arg=-Wl,-undefined,dynamic_lookup\"
            
            # 5. 编译成兼容 Android ARM64 的 Wheel 包
            /usr/local/python3.14/bin/python3 -m pip install --upgrade pip setuptools wheel maturin
            /usr/local/python3.14/bin/python3 -m pip wheel tokenizers==0.23.2 tree-sitter==0.26.0 --no-binary :all: -w /work/output_wheels/
          "

      - name: Upload Built Wheels
        uses: actions/upload-artifact@v4
        with:
          name: termux-arm64-wheels-py314
          path: output_wheels/*.whl
